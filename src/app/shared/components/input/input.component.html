@if (label()) {
  <label [for]="id()" class="input-label">{{ label() }}</label>
}

<div [class]="wrapClasses()">
  @if (hasStartSlot()) {
    <div class="input-slot input-slot-start">
      <ng-content select="[start]" />
    </div>
  }

  <input
    [id]="id()"
    [style.padding-left]="hasStartSlot() ? '42px' : null"
    [style.padding-right]="type() === 'password' ? '42px' : null"
    [mask]="mask()"
    [type]="inputType"
    [disabled]="disabledState() || disabled()"
    [readonly]="readOnly()"
    [autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [dropSpecialCharacters]="false"
    [ngModel]="value()"
    (focus)="focused.emit()"
    (blur)="onBlur()"
    (input)="onInputChange($event)" />

  @if (type() === 'password') {
    <button
      type="button"
      class="input-slot input-slot-end"
      (click)="showPassword.set(!showPassword())">
      @if (showPassword()) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      }
    </button>
  }

  <ng-content select="[suffix]" />
</div>

@if (control?.touched && control?.invalid) {
  <span class="input-hint input-hint-error">
    {{ validationErrorMessage.getError(control) }}
  </span>
} @else if (hint()) {
  <span class="input-hint">{{ hint() }}</span>
}
