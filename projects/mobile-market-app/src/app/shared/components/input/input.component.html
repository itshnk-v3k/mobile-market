@if (label()) {
  <label [for]="id()" class="input-label">
    {{ label() }}
  </label>
}

<div [class]="wrapClasses()">
  @if (hasStartSlot()) {
    <div class="input-slot input-slot-start">
      <ng-content select="[start]" />
    </div>
  }

  <input
    [id]="id()"
    [style.padding-left]="hasStartSlot() ? '42px' : null"
    [style.padding-right]="type() === 'password' ? '42px' : null"
    [mask]="mask()"
    [type]="inputType"
    [disabled]="disabledState() || disabled()"
    [readonly]="readOnly()"
    [autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [dropSpecialCharacters]="false"
    [ngModel]="value()"
    (focus)="focused.emit()"
    (blur)="onBlur()"
    (input)="onInputChange($event)" />

  @if (type() === 'password') {
    <button
      type="button"
      class="input-slot input-slot-end"
      (click)="showPassword.set(!showPassword())">
      <svg [lucideIcon]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
    </button>
  }

  <ng-content select="[suffix]" />
</div>

@if (control?.touched && control?.invalid) {
  <span class="input-hint input-hint-error">
    {{ validationErrorMessage.getError(control) }}
  </span>
} @else if (hint()) {
  <span class="input-hint">
    {{ hint() }}
  </span>
}
