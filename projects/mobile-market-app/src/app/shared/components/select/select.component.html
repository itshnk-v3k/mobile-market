@if (label()) {
  <label [for]="id()" class="select-label">
    {{ label() }}
  </label>
}

<button
  #trigger
  type="button"
  class="select-trigger"
  [id]="id()"
  [disabled]="disabledState()"
  (click)="toggle()">
  <span class="select-value" [class.select-placeholder]="!selectedLabel()">
    {{ selectedLabel() || placeholder() }}
  </span>

  <svg
    lucideIcon="chevron-down"
    [size]="16"
    class="select-chevron"
    [class.select-chevron-open]="dropdown.isOpen()" />
</button>

@if (hint()) {
  <span class="select-hint">
    {{ hint() }}
  </span>
}

<ng-template #dropdownTpl>
  <div class="select-dropdown" role="listbox">
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        class="select-option"
        [attr.data-selected]="isSelected(option)"
        [attr.data-disabled]="option.disabled || null"
        [attr.aria-selected]="isSelected(option)"
        [disabled]="option.disabled"
        (click)="select(option)">
        <span>
          {{ option.label }}
        </span>

        @if (isSelected(option)) {
          <svg lucideIcon="check" [size]="14" />
        }
      </button>
    }
  </div>
</ng-template>
