<div class="compare-empty-wrap" role="status" aria-label="Список сравнения пуст">
  <div class="compare-empty-icon" aria-hidden="true">
    <lucide-icon name="scale" [size]="48" />
  </div>

  <h2 class="compare-empty-title">Нет товаров для сравнения</h2>

  <p class="compare-empty-text">
    Добавьте до 4 товаров одной категории,
    <br />
    чтобы сравнить их характеристики
  </p>

  <a mButton variant="primary" routerLink="/" aria-label="Перейти в каталог">Перейти в каталог</a>
</div>
